events { worker_connections 1024; }

http {
  # Docker DNS: resuelve las N réplicas de "app" (round-robin de IPs)
  resolver 127.0.0.11 valid=5s ipv6=off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream snake_app {
    # Hash consistente por sala: todos los jugadores de una sala caen en la misma réplica,
    # y las salas distintas se reparten entre réplicas.
    hash $arg_room consistent;
    server app:3000 max_fails=2 fail_timeout=5s;
  }

  server {
    listen 80;

    # WebSocket: balanceado por nombre de sala (?room=xxx)
    location /ws {
      proxy_pass http://snake_app;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 1h;
    }

    # Estático + API: round-robin simple
    location / {
      proxy_pass http://snake_app;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
