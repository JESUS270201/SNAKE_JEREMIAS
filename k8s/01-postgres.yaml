apiVersion: v1
kind: Namespace
metadata:
  name: snake-dash
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: snake-dash
type: Opaque
stringData:
  POSTGRES_USER: snake
  POSTGRES_PASSWORD: snake-change-me
  POSTGRES_DB: snake
---
# ---------- PostgreSQL con almacenamiento persistente ----------
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: snake-dash
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef: { name: postgres-secret }
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "snake", "-d", "snake"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: snake-dash
spec:
  clusterIP: None
  selector: { app: postgres }
  ports:
    - port: 5432
