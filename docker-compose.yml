services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: snake
      POSTGRES_PASSWORD: snake
      POSTGRES_DB: snake
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snake -d snake"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: ./app
    image: snake-dash:latest
    environment:
      PGHOST: postgres
      PGUSER: snake
      PGPASSWORD: snake
      PGDATABASE: snake
      # Correo (recuperar contraseña): se leen del archivo .env (ver .env.example)
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-Snake Dash <no-reply@snakedash.local>}
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      replicas: 3          # 3 réplicas detrás del balanceador
    restart: unless-stopped

  lb:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:
